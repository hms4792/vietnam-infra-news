name: SA-10 & 11 Monthly Knowledge Index Update

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  agent-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      
    steps:
      - name: 1. 저장소 체크아웃
        uses: actions/checkout@v4
        
      - name: 2. Python 환경 구축
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          
      - name: 3. 의존성 패키지 설치
        run: pip install google-genai
        
      - name: 4. 기존 지식 사전 백업 (SA-11 델타 분석용)
        run: cp docs/shared/knowledge_index.json docs/shared/knowledge_index_old.json
        
      - name: 5. SA-10 에이전트 실행 (지식 사전 JSON 업데이트)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/knowledge_updater.py
        
      - name: 6. SA-11 품질 보증 에이전트 실행 (분석 리포트 생성)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/sa11_quality_assurance.py
        
      - name: 7. Pull Request 생성 (SA-11 리포트 포함)
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: SA-10 Knowledge Index 업데이트 및 SA-11 품질 평가 반영"
          title: "🤖 [SA-10 & 11] 이번 달 Knowledge Index 업데이트 및 품질 평가"
          body-path: docs/shared/sa11_pr_body.md
          branch: "sa-10-knowledge-update"
          delete-branch: true
